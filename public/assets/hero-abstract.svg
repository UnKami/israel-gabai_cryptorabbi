<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f5f5f5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="softShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="noise" mode="soft-light" />
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#warmGlow)" />
  <g filter="url(#grain)">
    <path d="M-100 700 C 200 550, 350 750, 650 600 C 900 470, 1150 740, 1500 500 L 1600 900 L 0 900 Z" fill="#0e0e0e" opacity="0.85" />
    <path d="M100 100 C 350 50, 500 220, 780 140 C 1030 70, 1280 260, 1500 120 L 1600 0 L 0 0 Z" fill="#111" opacity="0.7" />
    <circle cx="380" cy="360" r="180" fill="#ffffff" opacity="0.08" />
    <circle cx="1240" cy="520" r="220" fill="#ffffff" opacity="0.06" />
    <path d="M320 880 C 600 760, 820 900, 1100 780" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.2" />
  </g>
  <rect width="1600" height="900" fill="url(#softShadow)" opacity="0.35" />
</svg>
